<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Viral 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-link">← Kembali</a>
  <span class="live-badge"><span class="dot"></span> Live</span>
</div>

<div class="page-head video-theme">
  <h1>Video Viral 2026</h1>
  <p>Klik salah satu video di bawah untuk langsung memutarnya.</p>
</div>

<div id="grid" class="grid"></div>

<div id="emptyState" class="empty-state" style="display:none;">
  Belum ada video yang ditambahkan.
  <code>
    // buka file video.html, cari bagian VIDEO_LIST<br>
    { title: "Judul video", url: "https://youtu.be/xxxxxxx" }
  </code>
</div>

<footer class="site-footer">Video Viral 2026</footer>

<!-- Modal pemutar video -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="video-frame" id="videoFrame"></div>
    <p class="modal-title" id="modalTitle"></p>
  </div>
</div>

<script>
/* =========================================================
   ⭐ TAMBAHKAN LINK VIDEO DI SINI ⭐
   Cukup tambah satu baris baru { title: "...", url: "..." }
   di dalam kurung siku VIDEO_LIST di bawah ini.

   Format url yang didukung:
   1) Link YouTube biasa   : https://www.youtube.com/watch?v=XXXXXXXXXXX
   2) Link YouTube pendek  : https://youtu.be/XXXXXXXXXXX
   3) Link file video langsung (.mp4, .webm) yang bisa diakses publik
   4) Link embed TikTok / Instagram (opsional, lihat catatan di bawah)

   thumbnail (opsional): jika dikosongkan ("") maka:
   - untuk YouTube, thumbnail otomatis diambil dari YouTube
   - untuk video lain, akan tampil ikon play polos
   ========================================================= */

const VIDEO_LIST = [
  // Contoh — silakan hapus atau ganti dengan video kamu sendiri
  {
    title: "Contoh Video Viral 1",
    url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
    thumbnail: ""
  },
  {
    title: "Contoh Video Viral 2 (file mp4 langsung)",
    url: "",
    thumbnail: ""
  },

  // Tambahkan video baru kamu di bawah baris ini 👇
  // {
  //   title: "Judul video kamu",
  //   url: "https://youtu.be/XXXXXXXXXXX",
  //   thumbnail: ""
  // },
];

/* ========================================================= */

function getYoutubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

function isDirectVideoFile(url){
  return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url || "");
}

function buildThumb(item){
  if(item.thumbnail) return item.thumbnail;
  const yid = getYoutubeId(item.url);
  if(yid) return `https://img.youtube.com/vi/${yid}/hqdefault.jpg`;
  return null;
}

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');

const usableVideos = VIDEO_LIST.filter(v => v.url);

if(usableVideos.length === 0){
  emptyState.style.display = 'block';
} else {
  usableVideos.forEach((item) => {
    const thumbUrl = buildThumb(item);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        ${thumbUrl ? `<img src="${thumbUrl}" alt="${item.title}" loading="lazy">` : ''}
        <div class="play"><span>▶</span></div>
      </div>
      <div class="info">
        <h3>${item.title}</h3>
        <span class="tag">Video</span>
      </div>
    `;
    card.addEventListener('click', () => openVideo(item));
    grid.appendChild(card);
  });
}

const modalOverlay = document.getElementById('modalOverlay');
const videoFrame = document.getElementById('videoFrame');
const modalTitle = document.getElementById('modalTitle');
const modalClose = document.getElementById('modalClose');

function openVideo(item){
  modalTitle.textContent = item.title || '';
  const yid = getYoutubeId(item.url);

  if(yid){
    videoFrame.innerHTML = `<iframe src="https://www.youtube.com/embed/${yid}?autoplay=1&rel=0" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  } else if(isDirectVideoFile(item.url)){
    videoFrame.innerHTML = `<video src="${item.url}" controls autoplay playsinline></video>`;
  } else {
    // fallback: coba tampilkan sebagai iframe embed umum (misal TikTok/Instagram embed link)
    videoFrame.innerHTML = `<iframe src="${item.url}" title="${item.title}" allowfullscreen></iframe>`;
  }

  modalOverlay.classList.add('open');
}

function closeModal(){
  modalOverlay.classList.remove('open');
  videoFrame.innerHTML = '';
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});
</script>

</body>
</html>
