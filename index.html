<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO DURASI PANJANG</title>
<meta name="description" content="Galeri video vlog berepisode.">
<link rel="stylesheet" href="style.css">

<!-- ================= IKLAN: POPUNDER (site-wide) ================= -->
<script src="https://pl30599951.effectivecpmnetwork.com/3f/eb/5c/3feb5ca66aea8e7eeb0854be6e0dc089.js"></script>

<!-- ================= IKLAN: SOCIAL BAR (site-wide) ================= -->
<script src="https://pl30599952.effectivecpmnetwork.com/5e/49/a4/5e49a4f3992c8a88dc8d95a8bd449dea.js"></script>
</head>
<body>

<div class="filmstrip"></div>

<header class="site-header">
  <div class="brand-row">
    <div>
      <div class="brand">VIDEO <span>DURASI</span> PANJANG</div>
      <div class="tagline">Galeri Vlog Berepisode</div>
    </div>
  </div>
</header>

<!-- Banner 728x90 — di bawah header, hanya tampil di layar besar -->
<div class="ad-slot ad-728" style="display:none" id="wrap-728">
  <span class="ad-label">Iklan</span>
  <div data-ad="ad-728x90"></div>
</div>

<div class="shell">
  <main>

    <div class="section-head">
      <span class="num">01</span>
      <h2>Semua Episode</h2>
      <span class="rule"></span>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty-state" class="empty" style="display:none">
      Belum ada video. Tambahkan video pertamamu di <code>videos.js</code>.
    </div>

    <!-- Native banner iklan, di tengah konten -->
    <div class="ad-slot" style="margin-top:34px;">
      <span class="ad-label">Iklan</span>
      <script async="async" data-cfasync="false" src="https://pl30599953.effectivecpmnetwork.com/9376df59a8844456a144afd4102deccc/invoke.js"></script>
      <div id="container-9376df59a8844456a144afd4102deccc"></div>
    </div>

    <!-- Banner 300x250 -->
    <div class="ad-slot ad-300">
      <span class="ad-label">Iklan</span>
      <div data-ad="ad-300x250"></div>
    </div>

  </main>

  <aside class="rail">
    <div class="ad-slot ad-160-300">
      <span class="ad-label">Iklan</span>
      <div data-ad="ad-160x300"></div>
    </div>
    <div class="ad-slot ad-160-600">
      <span class="ad-label">Iklan</span>
      <div data-ad="ad-160x600"></div>
    </div>
  </aside>
</div>

<!-- Banner 468x60 — footer -->
<div class="ad-slot ad-468">
  <span class="ad-label">Iklan</span>
  <div data-ad="ad-468x60"></div>
</div>

<footer>
  <div class="fname">VIDEO DURASI PANJANG</div>
  <div style="margin-top:6px;">Semua video ditayangkan melalui Google Drive.</div>
</footer>

<!-- Banner 320x50 sticky — hanya tampil di mobile -->
<div class="sticky-mobile">
  <div data-ad="ad-320x50"></div>
</div>

<!-- ================= MODAL PLAYER ================= -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Judul Video</h3>
      <button class="close" id="modal-close" aria-label="Tutup">&times;</button>
    </div>
    <div class="player" id="player-wrap"></div>
    <div class="modal-foot">
      <span class="dur mono" id="modal-duration"></span>
      <a class="alt-server" href="https://www.effectivecpmnetwork.com/c0qqj85z?key=892f216c296b9fc6507e890d74d7968c" target="_blank" rel="noopener noreferrer">Server Alternatif</a>
    </div>
  </div>
</div>

<div class="filmstrip"></div>

<script src="videos.js"></script>
<script src="script.js"></script>
<script>
  // Tampilkan banner 728x90 hanya di layar >= 900px
  if (window.innerWidth >= 900) {
    document.getElementById('wrap-728').style.display = 'flex';
    document.getElementById('wrap-728').style.flexDirection = 'column';
  }
</script>

</body>
</html>
