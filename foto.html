<script>
/* =========================================================
   ⭐ TAMBAHKAN LINK FOTO DI SINI ⭐
   Cukup tambah satu baris baru { title: "...", url: "..." }
   di dalam kurung siku PHOTO_LIST di bawah ini.

   url harus berupa link gambar langsung, biasanya berakhiran
   .jpg / .jpeg / .png / .webp (boleh dari hosting mana saja,
   misalnya imgur, ibb.co, dll — asalkan link-nya bisa dibuka
   langsung sebagai gambar).

   Link Google Drive JUGA didukung — cukup paste link share
   biasa apa adanya, contoh:
   https://drive.google.com/file/d/XXXXXXXXXXX/view?usp=sharing
   -> pastikan setting share diatur "Anyone with the link" /
      "Siapa saja yang memiliki link"
   ========================================================= */

const PHOTO_LIST = [
  // Contoh — silakan hapus atau ganti dengan foto kamu sendiri
  {
    title: "Contoh Foto Viral 1",
    url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800"
  },
  {
    title: "Contoh Foto Viral 2",
    url: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
  },

  // Tambahkan foto baru kamu di bawah baris ini 👇
  {
    title: "Nona Selly",
    url: "https://drive.google.com/file/d/1k0knc9rjkREeFEbwz1bO3TUCOcXGfyPh/view?usp=drivesdk"
  },
];

/* ========================================================= */

function getDriveId(url){
  if(!url) return null;
  const patterns = [
    /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]{10,})/,
    /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]{10,})/,
    /drive\.google\.com\/uc\?id=([a-zA-Z0-9_-]{10,})/,
    /drive\.google\.com\/.*[?&]id=([a-zA-Z0-9_-]{10,})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

function resolveImageUrl(url){
  const did = getDriveId(url);
  if(did) return `https://drive.google.com/thumbnail?id=${did}&sz=w2000`;
  return url;
}

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const usablePhotos = PHOTO_LIST.filter(p => p.url);

if(usablePhotos.length === 0){
  emptyState.style.display = 'block';
} else {
  usablePhotos.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';
    const imgUrl = resolveImageUrl(item.url);
    card.innerHTML = `
      <div class="thumb">
        <img src="${imgUrl}" alt="${item.title}" loading="lazy">
      </div>
      <div class="info">
        <h3>${item.title}</h3>
        <span class="tag">Foto</span>
      </div>
    `;
    card.addEventListener('click', () => openPhoto(item));
    grid.appendChild(card);
  });
}

const modalOverlay = document.getElementById('modalOverlay');
const lightboxImg = document.getElementById('lightboxImg');
const modalTitle = document.getElementById('modalTitle');
const modalClose = document.getElementById('modalClose');

function openPhoto(item){
  lightboxImg.src = resolveImageUrl(item.url);
  lightboxImg.alt = item.title || '';
  modalTitle.textContent = item.title || '';
  modalOverlay.classList.add('open');
}

function closeModal(){
  modalOverlay.classList.remove('open');
  lightboxImg.src = '';
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});
</script>
